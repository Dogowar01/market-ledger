<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Market Ledger">
<link rel="icon" type="image/png" href="./icons/ml-192.png">
<link rel="manifest" href="./manifest.webmanifest?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/ml-180.png">
<link rel="apple-touch-icon" href="./icons/ml-192.png">
<title>Signal9 Market Ledger</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one phone-width column, brand strip on top, three thumb-reach tabs fixed at the bottom, forms slide up as sheets. */
:root{
  --bg:#0a0a0b; --surface:#141416; --surface-2:#1d1d20; --line:#2b2b30;
  --fg:#f5f3ee; --muted:#9c9a93; --accent:#fc6000; --accent-ink:#0a0a0b;
  --good:#86d6a6; --bad:#ff8f80;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 112px}
.top{display:flex;align-items:center;gap:12px;padding-block:10px 6px}
.top img{height:64px;width:auto;mix-blend-mode:screen;margin-left:-8px}
.top .label{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.top .label b{display:block;color:var(--fg);font-weight:600;font-size:13px;letter-spacing:.3em;margin-bottom:2px}

main{display:flex;flex-direction:column;gap:18px}
h1{font:600 30px/1.1 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font:600 11px/1 var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:0}
.sub{color:var(--muted);margin:0;font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.money{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 14px;min-height:36px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.link{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600;font-size:14px}
.back{background:none;border:0;padding:8px 8px 8px 0;color:var(--muted);font-size:14px}

.banner{border:1px dashed var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
.banner p{margin:0;flex:1 1 220px}

.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:13px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .m{color:var(--muted);font-size:13px}
.empty{color:var(--muted);padding:18px 2px;border-bottom:1px solid var(--line);font-size:14px}

.mk{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);text-align:left;width:100%}
.mk .day{width:50px;text-align:center;flex:none}
.mk .day b{display:block;font:600 26px/1 var(--display)}
.mk .day span{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.mk .t{font-weight:600;overflow-wrap:anywhere}
.mk .m{color:var(--muted);font-size:13px}
.mk .side{text-align:right;font-size:13px}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--muted)}
.chip.done{border-color:var(--good);color:var(--good)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles.four{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0;text-align:left}
.tile small{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.tile .money{font-size:clamp(15px,4.4vw,21px);font-weight:600}
.tile .n{font:600 24px/1 var(--display)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:9px 2px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--fg);color:var(--bg)}

.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;font-weight:600;padding:0}
.step button.plus{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step button:disabled{opacity:.3}
.step b{min-width:30px;text-align:center;font-family:var(--mono)}
.step small{display:block;font:400 9px/1.4 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.plainbtn{background:none;border:0;padding:0;text-align:left}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-2);border:1px solid var(--line)}
.thumb.ph{display:grid;place-items:center;color:var(--muted);font:600 18px/1 var(--display)}
.photo{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px;color:transparent}
.packed .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.packed .t{color:var(--muted);text-decoration:line-through}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
.addline{display:grid;grid-template-columns:1fr 64px auto;gap:8px}

label{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;letter-spacing:0;text-transform:none;color:var(--fg);width:100%;min-width:0}
textarea{min-height:150px;resize:vertical;line-height:1.5}
label.inline{flex-direction:row;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:15px;color:var(--fg)}
label.inline input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.bars{display:flex;flex-direction:column;gap:12px}
.bar .progress{margin-top:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:92px;padding-left:12px}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:1px solid var(--line)}

.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,11,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:none;padding:14px 4px 12px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:600;position:relative}
.tabs button[aria-current="page"]{color:var(--fg)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:680px;max-height:92%;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font:600 22px/1.2 var(--display);margin:0}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sheet .actions .primary{flex:1}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
@media (min-width:560px){.tiles.four{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>

  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections"><div>
  <button type="button" data-act="tab" data-tab="markets">Markets</button>
  <button type="button" data-act="tab" data-tab="purchases">Purchases</button>
  <button type="button" data-act="tab" data-tab="totals">Totals</button>
</div></nav>
<div id="scrim" class="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var KEY='s9-market-ledger-v1';
var CATS=['Stall fee','Travel & fuel','Food & drink','Stock & printing','Framing & packaging','Display & equipment','Insurance & permits','Other'];
var $=function(s){return document.querySelector(s)};
var view=$('#view'), scrim=$('#scrim'), sheet=$('#sheet');
var ui={tab:'markets',marketId:null,seg:'expenses',fy:'all'};

/* ---------- helpers ---------- */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function today(){return iso(new Date())}
function parse(s){var p=String(s||'').split('-');return new Date(+p[0],(+p[1]||1)-1,+p[2]||1)}
function fmtDate(s){return s?parse(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'}):'No date'}
function shortDate(s){return s?parse(s).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'2-digit'}):''}
var aud=new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'});
function money(n){return aud.format(n||0)}
function num(v){var n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)?Math.round(n*100)/100:0}
function sum(a,f){return a.reduce(function(t,x){return t+(f(x)||0)},0)}
function fyOf(s){var d=parse(s);return d.getMonth()>=6?d.getFullYear():d.getFullYear()-1}
function fyLabel(y){return 'FY '+y+'–'+String((y+1)%100).padStart(2,'0')}
function signed(n){return '<span class="money '+(n>0?'pos':n<0?'neg':'')+'">'+(n>0?'+':'')+money(n)+'</span>'}
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2200)}

/* ---------- data ---------- */
function seed(){
  var d=new Date(), next=new Date(d), last=new Date(d);
  next.setDate(d.getDate()+((7-d.getDay())%7||7)); last.setDate(next.getDate()-21);
  var a=uid(), b=uid()+'b';
  var kit=['Gazebo 3×3 m','Trestle table','Table mat and banner','Print browser box','Card reader','Cash float','Business cards','Certificates of authenticity','Cellophane sleeves','Folding chair'];
  function stock(sold){return [['A3 gicl\u00e9e print',85,6,3],['A4 print',45,8,1],['Greeting card',8,30,5]].map(function(r,i){return{id:uid()+'s'+i,name:r[0],price:r[1],qty:r[2],sold:sold?r[3]:0}})}
  function pack(done){return kit.map(function(n,i){return{id:uid()+i,name:n,qty:n==='Business cards'?50:1,packed:done||i<4}})}
  return {v:1,examples:true,
    markets:[
      {id:a,name:'Evandale Market',date:iso(next),location:'Falls Park, Evandale',takings:0,notes:'Gates open for stallholders at 7 am.',packing:pack(false),stock:stock(false)},
      {id:b,name:'Evandale Market',date:iso(last),location:'Falls Park, Evandale',takings:0,notes:'',packing:pack(true),stock:stock(true)}],
    expenses:[
      {id:uid()+'1',marketId:a,date:today(),desc:'Stall fee',category:'Stall fee',amount:30},
      {id:uid()+'2',marketId:b,date:iso(last),desc:'Stall fee',category:'Stall fee',amount:30},
      {id:uid()+'3',marketId:b,date:iso(last),desc:'Fuel, Grindelwald return',category:'Travel & fuel',amount:22.5},
      {id:uid()+'4',marketId:b,date:iso(last),desc:'Coffee and lunch',category:'Food & drink',amount:18},
      {id:uid()+'5',marketId:null,date:iso(last),desc:'Gazebo 3×3 m',category:'Display & equipment',amount:189},
      {id:uid()+'6',marketId:null,date:iso(last),desc:'Cellophane sleeves A3 ×100',category:'Framing & packaging',amount:42}]};
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&Array.isArray(s.markets)&&Array.isArray(s.expenses))return s}}catch(e){}
  return seed();
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device')}}
function market(id){return S.markets.filter(function(m){return m.id===id})[0]}
function expOf(id){return S.expenses.filter(function(e){return e.marketId===id}).sort(function(a,b){return a.date<b.date?1:-1})}
function spent(id){return sum(expOf(id),function(e){return e.amount})}
function sales(m){return sum(m.stock||[],function(x){return (x.price||0)*(x.sold||0)})}
function income(m){return sales(m)+(m.takings||0)}
function known(){var o={};S.markets.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(m){(m.stock||[]).forEach(function(x){o[x.name]={price:x.price,img:x.img||null}})});return o}

/* ---------- product photos (kept in IndexedDB, too big for localStorage) ---------- */
var IMG={}, idb=null, pendingImg=null;
function idbOpen(cb){try{var r=indexedDB.open('s9-market-ledger',1);r.onupgradeneeded=function(){r.result.createObjectStore('img')};r.onsuccess=function(){idb=r.result;cb()};r.onerror=function(){cb()}}catch(e){cb()}}
function idbPut(id,data){try{idb.transaction('img','readwrite').objectStore('img').put(data,id)}catch(e){toast('Photo could not be saved on this device')}}
function idbDel(id){try{idb.transaction('img','readwrite').objectStore('img').delete(id)}catch(e){}}
function usedImgs(){var u={};S.markets.forEach(function(m){(m.stock||[]).forEach(function(x){if(x.img)u[x.img]=1})});return u}
function loadImgs(){
  if(!idb)return;
  try{var u=usedImgs(), stale=[], c=idb.transaction('img').objectStore('img').openCursor();
    c.onsuccess=function(){var cur=c.result;if(cur){if(u[cur.key])IMG[cur.key]=cur.value;else stale.push(cur.key);cur.continue()}else{stale.forEach(idbDel);render()}}}catch(e){}
}
function thumb(x){var d=x.img&&IMG[x.img];return d?'<img class="thumb" src="'+d+'" alt="">':'<span class="thumb ph" aria-hidden="true">'+esc((x.name||'?').charAt(0).toUpperCase())+'</span>'}
function photoBox(){var d=pendingImg&&IMG[pendingImg];
  return (d?'<img class="photo" src="'+d+'" alt="Product photo">':'')+'<div class="row"><button type="button" class="btn small" data-act="pick-photo">'+(d?'Change photo':'Add photo')+'</button>'+(d?'<button type="button" class="btn small ghost" data-act="clear-photo">Remove photo</button>':'')+'</div>'}
function readPhoto(file){
  var url=URL.createObjectURL(file), im=new Image();
  im.onload=function(){
    var k=Math.min(1,900/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
    var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    var d=c.toDataURL('image/jpeg',.82), id='i'+uid();IMG[id]=d;idbPut(id,d);pendingImg=id;var b=$('#s-photo');if(b)b.innerHTML=photoBox();
  };
  im.onerror=function(){URL.revokeObjectURL(url);toast('That photo could not be read')};
  im.src=url;
}
function backup(){var u=usedImgs(), im={};Object.keys(u).forEach(function(k){if(IMG[k])im[k]=IMG[k]});return Object.assign({},S,{images:im})}

/* ---------- views ---------- */
function banner(){
  return S.examples?'<div class="banner"><p>These are example entries so you can see how it works.</p><button type="button" class="btn small" data-act="clear-examples">Clear and start fresh</button></div>':'';
}
function marketCard(m,past){
  var d=parse(m.date), sp=spent(m.id), net=income(m)-sp, p=m.packing||[], done=p.filter(function(x){return x.packed}).length;
  var side=past?signed(net)+'<div class="m">net</div>'
    :(p.length?'<span class="chip'+(done===p.length?' done':'')+'">'+done+'/'+p.length+' packed</span>':'<span class="chip">Nothing listed</span>');
  return '<button type="button" class="mk" data-act="open" data-id="'+m.id+'">'+
    '<div class="day"><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString('en-AU',{month:'short'})+'</span></div>'+
    '<div class="grow"><div class="t">'+esc(m.name)+'</div><div class="m">'+esc(m.location||d.toLocaleDateString('en-AU',{weekday:'long'}))+'</div></div>'+
    '<div class="side">'+side+'</div></button>';
}
function viewMarkets(){
  var t=today();
  var up=S.markets.filter(function(m){return m.date>=t}).sort(function(a,b){return a.date<b.date?-1:1});
  var past=S.markets.filter(function(m){return m.date<t}).sort(function(a,b){return a.date<b.date?1:-1});
  return banner()+
   '<div class="row between"><h1>Markets</h1><button type="button" class="btn primary" data-act="market-form">Add market</button></div>'+
   '<section class="stack"><h2>Coming up</h2>'+(up.length?up.map(function(m){return marketCard(m,false)}).join(''):'<p class="empty">No markets booked. Add the next one you are going to.</p>')+'</section>'+
   '<section class="stack"><h2>Been to</h2>'+(past.length?past.map(function(m){return marketCard(m,true)}).join(''):'<p class="empty">Markets move here once their date has passed.</p>')+'</section>';
}
function expRow(e,showMarket){
  var m=showMarket&&e.marketId?market(e.marketId):null;
  return '<button type="button" class="item" data-act="expense-form" data-id="'+e.id+'">'+
   '<div class="grow"><div class="t">'+esc(e.desc||e.category)+'</div><div class="m">'+esc(e.category)+' · '+shortDate(e.date)+(m?' · '+esc(m.name):'')+'</div></div>'+
   '<div class="money">'+money(e.amount)+'</div></button>';
}
function viewMarket(m){
  var ex=expOf(m.id), sp=sum(ex,function(e){return e.amount}), net=income(m)-sp, p=m.packing||[], done=p.filter(function(x){return x.packed}).length;
  var body='';
  if(ui.seg==='expenses'){
    body='<div class="list">'+(ex.length?ex.map(function(e){return expRow(e)}).join(''):'<p class="empty">No expenses yet. Stall fee, fuel and food all go here.</p>')+'</div>'+
         '<button type="button" class="btn block" data-act="expense-form" data-market="'+m.id+'">Add expense</button>';
  }else if(ui.seg==='packing'){
    var others=S.markets.filter(function(o){return o.id!==m.id&&(o.packing||[]).length});
    body=(p.length?'<div class="stack"><div class="row between"><span class="sub">'+done+' of '+p.length+' packed</span><button type="button" class="link" data-act="untick">Untick all</button></div><div class="progress"><i style="width:'+(done/p.length*100)+'%"></i></div></div>':'')+
     '<form class="addline" data-form="pack"><input id="pack-name" name="name" placeholder="Add an item" autocomplete="off" aria-label="Item"><input id="pack-qty" name="qty" inputmode="numeric" placeholder="Qty" aria-label="Quantity"><button class="btn primary" type="submit">Add</button></form>'+
     '<div class="list">'+(p.length?p.map(function(x){return '<div class="item'+(x.packed?' packed':'')+'"><button type="button" class="row grow plainbtn" data-act="toggle" data-id="'+x.id+'" aria-pressed="'+!!x.packed+'"><span class="check">✓</span><span class="grow"><span class="t">'+esc(x.name)+'</span></span></button>'+(x.qty>1?'<span class="chip">×'+x.qty+'</span>':'')+'<button type="button" class="back" data-act="unpack" data-id="'+x.id+'" aria-label="Remove '+esc(x.name)+'">Remove</button></div>'}).join(''):'<p class="empty">Nothing listed yet. Add the gear you are taking: gazebo, table, float, bags.</p>')+'</div>'+
     (!p.length&&others.length?'<button type="button" class="btn block" data-act="copy-pack">Copy list from last market</button>':'');
  }else if(ui.seg==='stock'){
    var st=m.stock||[], units=sum(st,function(x){return x.qty}), nsold=sum(st,function(x){return x.sold});
    body=(st.length?'<div class="row between"><span class="sub">Sold '+nsold+' of '+units+'</span><span class="money">'+money(sales(m))+'</span></div>':'')+
     '<div class="list">'+(st.length?st.map(function(x){var left=(x.qty||0)-(x.sold||0);
       return '<div class="item"><button type="button" class="row grow plainbtn" data-act="stock-form" data-id="'+x.id+'">'+thumb(x)+'<div class="grow"><div class="t">'+esc(x.name)+'</div><div class="m"><span class="money">'+money(x.price)+'</span> \u00b7 took '+(x.qty||0)+' \u00b7 '+(left>0?left+' left':'sold out')+'</div></div></button>'+
        '<div class="step"><button type="button" data-act="sold" data-id="'+x.id+'" data-by="-1" aria-label="One fewer sold"'+(x.sold>0?'':' disabled')+'>\u2212</button><b>'+(x.sold||0)+'<small>sold</small></b><button type="button" class="plus" data-act="sold" data-id="'+x.id+'" data-by="1" aria-label="One more sold"'+(left>0?'':' disabled')+'>+</button></div></div>'}).join(''):'<p class="empty">No products listed yet. Add what you are taking to sell, with its price, then tap + each time one sells.</p>')+'</div>'+
     '<button type="button" class="btn block" data-act="stock-form">Add product</button>'+
     (!st.length&&S.markets.some(function(o){return o.id!==m.id&&(o.stock||[]).length})?'<button type="button" class="btn block" data-act="copy-stock">Copy products from last market</button>':'');
  }else{
    body='<label for="notes">Notes for this market<textarea id="notes" data-notes placeholder="Pitch number, setup time, what sold, who to follow up.">'+esc(m.notes||'')+'</textarea></label>';
  }
  function seg(k,l){return '<button type="button" role="tab" data-act="seg" data-seg="'+k+'" aria-selected="'+(ui.seg===k)+'">'+l+'</button>'}
  return '<div class="row between"><button type="button" class="back" data-act="tab" data-tab="markets">← All markets</button><button type="button" class="btn small" data-act="market-form" data-id="'+m.id+'">Edit</button></div>'+
   '<div><h1>'+esc(m.name)+'</h1><p class="sub">'+fmtDate(m.date)+(m.location?' · '+esc(m.location):'')+'</p></div>'+
   '<div class="tiles"><div class="tile"><small>Spent</small><span class="money">'+money(sp)+'</span></div>'+
   '<button type="button" class="tile" data-act="seg" data-seg="stock"><small>Takings</small><span class="money">'+money(income(m))+'</span></button>'+
   '<div class="tile"><small>Net</small>'+signed(net)+'</div></div>'+
   '<div class="seg" role="tablist">'+seg('stock','Stock')+seg('packing','Packing')+seg('expenses','Expenses')+seg('notes','Notes')+'</div>'+body;
}
function viewPurchases(){
  var g=S.expenses.filter(function(e){return !e.marketId}).sort(function(a,b){return a.date<b.date?1:-1});
  return banner()+
   '<div class="row between"><h1>Purchases</h1><button type="button" class="btn primary" data-act="expense-form">Add purchase</button></div>'+
   '<p class="sub">Things you have bought that are not tied to one market: display gear, stock, packaging, insurance.</p>'+
   '<div class="tiles four"><div class="tile"><small>Items</small><span class="n">'+g.length+'</span></div><div class="tile"><small>Total</small><span class="money">'+money(sum(g,function(e){return e.amount}))+'</span></div></div>'+
   '<div class="list">'+(g.length?g.map(function(e){return expRow(e)}).join(''):'<p class="empty">No purchases yet.</p>')+'</div>';
}
function viewTotals(){
  var years={};S.markets.forEach(function(m){years[fyOf(m.date)]=1});S.expenses.forEach(function(e){years[fyOf(e.date)]=1});
  var ys=Object.keys(years).map(Number).sort(function(a,b){return b-a});
  if(ui.fy!=='all'&&ys.indexOf(+ui.fy)<0)ui.fy='all';
  var inFy=function(d){return ui.fy==='all'||fyOf(d)===+ui.fy};
  var t=today(), ms=S.markets.filter(function(m){return inFy(m.date)}).sort(function(a,b){return a.date<b.date?1:-1});
  var ex=S.expenses.filter(function(e){return inFy(e.date)});
  var total=sum(ex,function(e){return e.amount}), takings=sum(ms,function(m){return income(m)}), net=takings-total;
  var attended=ms.filter(function(m){return m.date<t}).length;
  var cats=CATS.map(function(c){return{c:c,v:sum(ex.filter(function(e){return e.category===c}),function(e){return e.amount})}}).filter(function(x){return x.v>0}).sort(function(a,b){return b.v-a.v});
  var max=cats.length?cats[0].v:1;
  var prod={};ms.forEach(function(m){(m.stock||[]).forEach(function(x){if(!x.sold)return;prod[x.name]=prod[x.name]||{n:x.name,u:0,v:0};prod[x.name].u+=x.sold;prod[x.name].v+=x.sold*(x.price||0)})});
  var sold=Object.keys(prod).map(function(k){return prod[k]}).sort(function(a,b){return b.v-a.v});
  var other=sum(ms,function(m){return m.takings});if(other>0)sold.push({n:'Other takings',u:0,v:other});
  var smax=sold.reduce(function(t,x){return Math.max(t,x.v)},1);
  var general=sum(ex.filter(function(e){return !e.marketId}),function(e){return e.amount});
  var rows=ms.map(function(m){var s=sum(ex.filter(function(e){return e.marketId===m.id}),function(e){return e.amount});
    return '<tr><td>'+esc(m.name)+'<div class="m sub">'+shortDate(m.date)+'</div></td><td class="money">'+money(s)+'</td><td class="money">'+money(income(m))+'</td><td>'+signed(income(m)-s)+'</td></tr>'}).join('');
  return banner()+
   '<div class="row between"><h1>Totals</h1><select id="fy" data-fy aria-label="Period" style="width:auto"><option value="all">All time</option>'+ys.map(function(y){return '<option value="'+y+'"'+(String(ui.fy)===String(y)?' selected':'')+'>'+fyLabel(y)+'</option>'}).join('')+'</select></div>'+
   '<div class="tiles four"><div class="tile"><small>Markets</small><span class="n">'+attended+'</span> <span class="sub">'+(ms.length-attended?'+ '+(ms.length-attended)+' booked':'attended')+'</span></div>'+
   '<div class="tile"><small>Spent</small><span class="money">'+money(total)+'</span></div>'+
   '<div class="tile"><small>Takings</small><span class="money">'+money(takings)+'</span></div>'+
   '<div class="tile"><small>Net</small>'+signed(net)+'</div></div>'+
   '<section class="stack"><h2>Where the money went</h2>'+(cats.length?'<div class="bars">'+cats.map(function(x){return '<div class="bar"><div class="row between"><span>'+esc(x.c)+'</span><span class="money">'+money(x.v)+'</span></div><div class="progress"><i style="width:'+Math.max(2,x.v/max*100)+'%"></i></div></div>'}).join('')+'</div>':'<p class="empty">Nothing spent in this period.</p>')+'</section>'+
   '<section class="stack"><h2>What sold</h2>'+(sold.length?'<div class="bars">'+sold.map(function(x){return '<div class="bar"><div class="row between"><span>'+esc(x.n)+(x.u?' <span class="chip">\u00d7'+x.u+'</span>':'')+'</span><span class="money">'+money(x.v)+'</span></div><div class="progress"><i style="width:'+Math.max(2,x.v/smax*100)+'%"></i></div></div>'}).join('')+'</div>':'<p class="empty">No sales recorded in this period.</p>')+'</section>'+
   '<section class="stack"><h2>Market by market</h2><div class="tablewrap"><table><thead><tr><th>Market</th><th>Spent</th><th>Takings</th><th>Net</th></tr></thead><tbody>'+rows+
   '<tr><td>General purchases</td><td class="money">'+money(general)+'</td><td class="money">—</td><td>'+signed(-general)+'</td></tr></tbody>'+
   '<tfoot><tr><td>Total</td><td class="money">'+money(total)+'</td><td class="money">'+money(takings)+'</td><td>'+signed(net)+'</td></tr></tfoot></table></div></section>'+
   '<section class="stack"><h2>Your data</h2><p class="sub">Everything is stored on this device only. Save a backup now and then, and use it to move to another phone or computer.</p>'+
   '<div class="row" style="flex-wrap:wrap"><button type="button" class="btn small" data-act="export" data-kind="json">Back up</button><button type="button" class="btn small" data-act="export" data-kind="csv">Expenses as CSV</button><button type="button" class="btn small" data-act="export" data-kind="sales">Sales as CSV</button><button type="button" class="btn small" data-act="import">Restore backup</button></div></section>';
}
function render(){
  var m=ui.marketId&&market(ui.marketId);
  if(ui.tab==='markets'&&ui.marketId&&!m)ui.marketId=null;
  view.innerHTML=ui.tab==='purchases'?viewPurchases():ui.tab==='totals'?viewTotals():(m?viewMarket(m):viewMarkets());
  document.querySelectorAll('.tabs button').forEach(function(b){if(b.dataset.tab===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
}

/* ---------- sheets ---------- */
function openSheet(html,focus){sheet.innerHTML=html;scrim.hidden=false;sheet.scrollTop=0;var f=focus&&sheet.querySelector(focus);if(f)setTimeout(function(){f.focus()},60)}
function closeSheet(){scrim.hidden=true;sheet.innerHTML=''}
function marketForm(id,focus){
  var m=id?market(id):null, hasPrev=!m&&S.markets.some(function(o){return (o.packing||[]).length||(o.stock||[]).length});
  openSheet('<form class="stack" data-form="market" data-id="'+(id||'')+'"><h3>'+(m?'Edit market':'Add a market')+'</h3>'+
   '<label for="m-name">Market name<input id="m-name" name="name" required value="'+esc(m?m.name:'')+'" placeholder="Evandale Market"></label>'+
   '<div class="two"><label for="m-date">Date<input id="m-date" name="date" type="date" required value="'+esc(m?m.date:today())+'"></label>'+
   '<label for="m-takings">Other takings ($)<input id="m-takings" name="takings" inputmode="decimal" value="'+(m&&m.takings?m.takings:'')+'" placeholder="Not in Stock"></label></div>'+
   '<label for="m-loc">Location<input id="m-loc" name="location" value="'+esc(m?m.location:'')+'" placeholder="Falls Park, Evandale"></label>'+
   (m?'':'<label for="m-fee">Stall fee ($)<input id="m-fee" name="fee" inputmode="decimal" placeholder="Leave blank if none"></label>')+
   (hasPrev?'<label class="inline" for="m-copy"><input id="m-copy" name="copy" type="checkbox" checked>Start with the packing list and products from my last market</label>':'')+
   '<div class="actions"><button class="btn primary" type="submit">'+(m?'Save':'Add market')+'</button><button type="button" class="btn ghost" data-act="close">Cancel</button>'+
   (m?'<button type="button" class="btn ghost danger" data-act="delete-market" data-id="'+m.id+'">Delete</button>':'')+'</div></form>',focus==='takings'?'#m-takings':(m?null:'#m-name'));
}
function expenseForm(id,marketId){
  var e=id?S.expenses.filter(function(x){return x.id===id})[0]:null;
  var mid=e?e.marketId:(marketId||null), general=!mid&&!marketId&&ui.tab==='purchases';
  var opts='<option value="">General purchase (no market)</option>'+S.markets.slice().sort(function(a,b){return a.date<b.date?1:-1}).map(function(m){return '<option value="'+m.id+'"'+(m.id===mid?' selected':'')+'>'+esc(m.name)+' · '+shortDate(m.date)+'</option>'}).join('');
  var cat=e?e.category:(general?'Display & equipment':'Travel & fuel');
  openSheet('<form class="stack" data-form="expense" data-id="'+(id||'')+'"><h3>'+(e?'Edit entry':(general?'Add a purchase':'Add an expense'))+'</h3>'+
   '<label for="e-desc">What was it?<input id="e-desc" name="desc" required value="'+esc(e?e.desc:'')+'" placeholder="'+(general?'Gazebo, frames, print run':'Fuel, stall fee, lunch')+'"></label>'+
   '<div class="two"><label for="e-amt">Amount ($)<input id="e-amt" name="amount" inputmode="decimal" required value="'+(e?e.amount:'')+'" placeholder="0.00"></label>'+
   '<label for="e-date">Date<input id="e-date" name="date" type="date" required value="'+esc(e?e.date:today())+'"></label></div>'+
   '<label for="e-cat">Category<select id="e-cat" name="category">'+CATS.map(function(c){return '<option'+(c===cat?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></label>'+
   '<label for="e-market">Belongs to<select id="e-market" name="marketId">'+opts+'</select></label>'+
   '<div class="actions"><button class="btn primary" type="submit">'+(e?'Save':'Add')+'</button><button type="button" class="btn ghost" data-act="close">Cancel</button>'+
   (e?'<button type="button" class="btn ghost danger" data-act="delete-expense" data-id="'+e.id+'">Delete</button>':'')+'</div></form>',e?null:'#e-desc');
}
function stockForm(id){
  var m=market(ui.marketId);if(!m)return;
  var x=id?(m.stock||[]).filter(function(y){return y.id===id})[0]:null, k=known();
  pendingImg=x?x.img||null:null;
  openSheet('<form class="stack" data-form="stock" data-id="'+(id||'')+'"><h3>'+(x?'Edit product':'Add a product')+'</h3>'+
   '<label for="s-name">Product<input id="s-name" name="name" required list="s-known" autocomplete="off" value="'+esc(x?x.name:'')+'" placeholder="A3 gicl\u00e9e print"></label>'+
   '<datalist id="s-known">'+Object.keys(k).map(function(n){return '<option value="'+esc(n)+'"></option>'}).join('')+'</datalist>'+
   '<div class="stack" id="s-photo">'+photoBox()+'</div><input id="s-file" class="vh" type="file" accept="image/*" aria-label="Product photo" tabindex="-1">'+
   '<div class="two"><label for="s-price">Price each ($)<input id="s-price" name="price" inputmode="decimal" required value="'+(x?x.price:'')+'" placeholder="0.00"></label>'+
   '<label for="s-qty">How many taking<input id="s-qty" name="qty" inputmode="numeric" required value="'+(x?x.qty:'')+'" placeholder="1"></label></div>'+
   (x?'<label for="s-sold">Sold<input id="s-sold" name="sold" inputmode="numeric" value="'+(x.sold||0)+'"></label>':'')+
   '<div class="actions"><button class="btn primary" type="submit">'+(x?'Save':'Add product')+'</button><button type="button" class="btn ghost" data-act="close">Cancel</button>'+
   (x?'<button type="button" class="btn ghost danger" data-act="delete-stock" data-id="'+x.id+'">Delete</button>':'')+'</div></form>',x?null:'#s-name');
}
function salesCsv(){
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}, rows=['Date,Market,Product,Price,Taken,Sold,Revenue'];
  S.markets.slice().sort(function(a,b){return a.date<b.date?-1:1}).forEach(function(m){
    (m.stock||[]).forEach(function(x){rows.push([m.date,q(m.name),q(x.name),(x.price||0).toFixed(2),x.qty||0,x.sold||0,((x.price||0)*(x.sold||0)).toFixed(2)].join(','))});
    if(m.takings)rows.push([m.date,q(m.name),q('Other takings'),'','','',(m.takings).toFixed(2)].join(','))});
  return rows.join('\n');
}
function csv(){
  var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'};
  return ['Date,Market,Category,Description,Amount'].concat(S.expenses.slice().sort(function(a,b){return a.date<b.date?-1:1}).map(function(e){
    var m=e.marketId&&market(e.marketId);return [e.date,q(m?m.name+' '+m.date:'General'),q(e.category),q(e.desc),(e.amount||0).toFixed(2)].join(',')})).join('\n');
}
function exportSheet(kind){
  var text=kind==='csv'?csv():kind==='sales'?salesCsv():JSON.stringify(backup(),null,1), name='signal9-market-'+(kind==='sales'?'sales':kind==='csv'?'expenses':'ledger')+'-'+today()+(kind==='json'?'.json':'.csv');
  openSheet('<div class="stack"><h3>'+(kind==='csv'?'Expenses as CSV':kind==='sales'?'Sales as CSV':'Back up')+'</h3><p class="sub">Download the file, or copy the text and paste it somewhere safe.'+(kind==='json'?' Product photos are included.':'')+'</p>'+
   '<textarea id="export-text" readonly aria-label="Export">'+esc(text)+'</textarea>'+
   '<div class="actions"><button type="button" class="btn primary" data-act="download" data-name="'+name+'" data-mime="'+(kind==='json'?'application/json':'text/csv')+'">Download file</button><button type="button" class="btn" data-act="copy">Copy</button><button type="button" class="btn ghost" data-act="close">Done</button></div></div>');
}
function importSheet(){
  openSheet('<form class="stack" data-form="import"><h3>Restore backup</h3><p class="sub">This replaces everything in the ledger on this device with the backup.</p>'+
   '<label for="imp-file">Backup file<input id="imp-file" type="file" accept=".json,application/json"></label>'+
   '<label for="imp-text">Or paste the backup text<textarea id="imp-text" name="text"></textarea></label>'+
   '<div class="actions"><button class="btn primary" type="submit">Replace my data</button><button type="button" class="btn ghost" data-act="close">Cancel</button></div></form>');
}
function restore(text){
  try{var s=JSON.parse(text);if(!s||!Array.isArray(s.markets)||!Array.isArray(s.expenses))throw 0;var ims=s.images||{};delete s.images;Object.keys(ims).forEach(function(k){IMG[k]=ims[k];idbPut(k,ims[k])});s.examples=false;S=s;save();closeSheet();ui.marketId=null;render();toast('Backup restored')}
  catch(e){toast('That is not a Market Ledger backup')}
}
function confirmTwice(btn,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed='1';btn.textContent='Tap again to delete';setTimeout(function(){if(btn.isConnected){delete btn.dataset.armed;btn.textContent='Delete'}},3500);
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  if(ev.target===scrim){closeSheet();return}
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act, d=b.dataset, m=ui.marketId&&market(ui.marketId);
  if(a==='tab'){ui.tab=d.tab;ui.marketId=null;render();window.scrollTo(0,0)}
  else if(a==='open'){ui.marketId=d.id;var od=market(d.id).date;ui.seg=od>today()?'packing':od===today()?'stock':'expenses';render();window.scrollTo(0,0)}
  else if(a==='seg'){ui.seg=d.seg;render()}
  else if(a==='market-form')marketForm(d.id,d.focus);
  else if(a==='expense-form')expenseForm(d.id,d.market);
  else if(a==='close')closeSheet();
  else if(a==='clear-examples'){S={v:1,examples:false,markets:[],expenses:[]};save();ui.marketId=null;render();toast('Ready for your first market')}
  else if(a==='toggle'&&m){m.packing.forEach(function(x){if(x.id===d.id)x.packed=!x.packed});save();render()}
  else if(a==='unpack'&&m){m.packing=m.packing.filter(function(x){return x.id!==d.id});save();render()}
  else if(a==='untick'&&m){m.packing.forEach(function(x){x.packed=false});save();render()}
  else if(a==='copy-pack'&&m){m.packing=lastPacking(m.id);save();render();toast('List copied')}
  else if(a==='stock-form')stockForm(d.id);
  else if(a==='sold'&&m){(m.stock||[]).forEach(function(x){if(x.id===d.id)x.sold=Math.max(0,Math.min(x.qty||0,(x.sold||0)+(+d.by)))});save();render()}
  else if(a==='copy-stock'&&m){m.stock=lastStock(m.id);save();render();toast('Products copied')}
  else if(a==='delete-stock'&&m)confirmTwice(b,function(){m.stock=(m.stock||[]).filter(function(x){return x.id!==d.id});save();closeSheet();render();toast('Deleted')});
  else if(a==='pick-photo'){var fi=$('#s-file');if(fi)fi.click()}
  else if(a==='clear-photo'){pendingImg=null;$('#s-photo').innerHTML=photoBox()}
  else if(a==='delete-market')confirmTwice(b,function(){S.markets=S.markets.filter(function(x){return x.id!==d.id});S.expenses=S.expenses.filter(function(x){return x.marketId!==d.id});save();closeSheet();ui.marketId=null;render();toast('Market deleted')});
  else if(a==='delete-expense')confirmTwice(b,function(){S.expenses=S.expenses.filter(function(x){return x.id!==d.id});save();closeSheet();render();toast('Deleted')});
  else if(a==='export')exportSheet(d.kind);
  else if(a==='import')importSheet();
  else if(a==='copy'){var t=$('#export-text');var done=function(){toast('Copied')};
    try{navigator.clipboard.writeText(t.value).then(done,function(){t.select();toast('Selected. Copy it from here')})}catch(e){t.select();toast('Selected. Copy it from here')}}
  else if(a==='download'){try{var url=URL.createObjectURL(new Blob([$('#export-text').value],{type:d.mime}));var l=document.createElement('a');l.href=url;l.download=d.name;document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(url)},2000)}catch(e){toast('Download is not available here. Use Copy')}}
});
function lastPacking(exceptId){
  var src=S.markets.filter(function(o){return o.id!==exceptId&&(o.packing||[]).length}).sort(function(a,b){return a.date<b.date?1:-1})[0];
  return src?src.packing.map(function(x,i){return{id:uid()+i,name:x.name,qty:x.qty,packed:false}}):[];
}
function lastStock(exceptId){
  var src=S.markets.filter(function(o){return o.id!==exceptId&&(o.stock||[]).length}).sort(function(a,b){return a.date<b.date?1:-1})[0];
  return src?src.stock.map(function(x,i){return{id:uid()+'s'+i,name:x.name,price:x.price,qty:x.qty,sold:0,img:x.img||null}}):[];
}
document.addEventListener('submit',function(ev){
  var f=ev.target, kind=f.dataset.form;if(!kind)return;ev.preventDefault();
  var v={};new FormData(f).forEach(function(val,k){v[k]=typeof val==='string'?val.trim():val});
  if(kind==='market'){
    var m=f.dataset.id&&market(f.dataset.id);
    if(m){m.name=v.name;m.date=v.date;m.location=v.location;m.takings=num(v.takings)}
    else{m={id:uid(),name:v.name,date:v.date,location:v.location,takings:num(v.takings),notes:'',packing:v.copy?lastPacking(null):[],stock:v.copy?lastStock(null):[]};S.markets.push(m);
      if(num(v.fee)>0)S.expenses.push({id:uid()+'f',marketId:m.id,date:today(),desc:'Stall fee',category:'Stall fee',amount:num(v.fee)});
      ui.tab='markets';ui.marketId=m.id;ui.seg='packing'}
    save();closeSheet();render();toast(f.dataset.id?'Saved':'Market added');
  }else if(kind==='expense'){
    var e=f.dataset.id&&S.expenses.filter(function(x){return x.id===f.dataset.id})[0];
    var rec={desc:v.desc,amount:num(v.amount),date:v.date,category:v.category,marketId:v.marketId||null};
    if(e)Object.assign(e,rec);else{rec.id=uid();S.expenses.push(rec)}
    save();closeSheet();render();toast(e?'Saved':'Added');
  }else if(kind==='pack'){
    var mk=market(ui.marketId);if(!mk||!v.name)return;
    mk.packing=mk.packing||[];mk.packing.push({id:uid(),name:v.name,qty:Math.max(1,parseInt(v.qty,10)||1),packed:false});
    save();render();var n=$('#pack-name');if(n)n.focus();
  }else if(kind==='stock'){
    var ms=market(ui.marketId);if(!ms)return;ms.stock=ms.stock||[];
    var x=f.dataset.id&&ms.stock.filter(function(y){return y.id===f.dataset.id})[0];
    var qn=Math.max(0,parseInt(v.qty,10)||0), r2={img:pendingImg||null,name:v.name,price:num(v.price),qty:qn,sold:Math.max(0,Math.min(qn,parseInt(v.sold,10)||0))};
    if(x)Object.assign(x,r2);else{r2.id=uid();ms.stock.push(r2)}
    save();closeSheet();render();toast(x?'Saved':'Product added');
  }else if(kind==='import'){
    var file=$('#imp-file').files[0];
    if(file){var r=new FileReader();r.onload=function(){restore(r.result)};r.readAsText(file)}
    else if(v.text)restore(v.text);else toast('Choose a file or paste the backup text');
  }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='s-name'){var kp=known()[ev.target.value],pi=$('#s-price');if(kp){if(pi&&!pi.value)pi.value=kp.price;if(!pendingImg&&kp.img&&IMG[kp.img]){pendingImg=kp.img;$('#s-photo').innerHTML=photoBox()}}}
  if(ev.target.matches('[data-notes]')){var m=market(ui.marketId);if(m){m.notes=ev.target.value;save()}}
});
document.addEventListener('change',function(ev){if(ev.target.id==='s-file'&&ev.target.files[0]){readPhoto(ev.target.files[0]);ev.target.value='';return}if(ev.target.matches('[data-fy]')){ui.fy=ev.target.value;render()}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!scrim.hidden)closeSheet()});
render();idbOpen(loadImgs);
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){})}</script>
