<title>Foxtrot test</title>
<style>body{font:18px/1.5 -apple-system,sans-serif;background:#0a0a0b;color:#f5f3ee;margin:0;padding:28px 18px}h1{font-size:44px;margin:0 0 8px;color:#fc6000}a{color:#fc6000;display:block;padding:10px 0}b{color:#86d6a6}</style>

<body>
<h1>Test F</h1><p>Offline helper: <b id="sw">checking</b></p><p>Tap Share, then Add to Home Screen, and look at the icon preview. Note whether it shows the orange artwork or a letter, then cancel.</p><a href="test-g.html">Next: Test G &rarr;</a>
<script>
(function(){var el=document.getElementById('sw');function show(){el.textContent=(navigator.serviceWorker&&navigator.serviceWorker.controller)?'still on - reload this page once':'off (good)'}
if(!navigator.serviceWorker){show();return}
navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}).then(function(){
  var done;try{done=sessionStorage.getItem('swr')}catch(e){done=1}
  if(navigator.serviceWorker.controller&&!done){try{sessionStorage.setItem('swr','1')}catch(e){}location.reload()}else show()}).catch(show)})();
</script>
</body>
</html>
